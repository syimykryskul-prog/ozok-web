<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23091C35'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2300BEBA' stroke-width='4'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var m = localStorage.getItem('ozok.theme') || 'system';
        var d = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.lang = localStorage.getItem('ozok.lang') === 'ky' ? 'ky' : 'ru';
      } catch (e) {}
    </script>
    <title>OZOK ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
